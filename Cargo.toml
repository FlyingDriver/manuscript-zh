[package]
name = "manuscript"
version = "1.6.3"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Ilshat Ishdavletov", "FlyingDriver"]
description = "Chinese-localised GNOME-native Markdown reader and editor"
repository = "https://github.com/FlyingDriver/manuscript-zh"
homepage = "https://github.com/FlyingDriver/manuscript-zh"
readme = "README.md"
keywords = ["markdown", "editor", "gtk4", "gnome", "chinese"]
categories = ["text-editors", "gui"]

[dependencies]
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
pulldown-cmark = "0.12"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
sourceview5 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pangocairo = "0.20"
dirs = "6"
unicode-width = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"
libspelling = "0.3.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Enable line tables for flamegraph/perf without bloating binary too much.
# Strip via `strip = "symbols"` (Cargo.toml inherited setting) for release.
debug = "line-tables-only"
